name: Publish Cinema500
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble complete static site
        run: |
          mkdir -p _site
          cp index.html app.js discovery.js catalogue.js live.js ranks.js motion.js style.css mobile.css favicon.svg .nojekyll mobile-preview.html selects.js dates.js manifest.webmanifest sitemap.xml _site/
          cp -R icons _site/
          unzip -q artwork-1.zip -d _site
          unzip -q artwork-2.zip -d _site
          python3 - <<'PY'
          import json
          from pathlib import Path
          text=Path('_site/catalogue.js').read_text()
          titles=json.loads(text.split('=',1)[1].rstrip(';\n'))['titles']
          assert len(titles)==500 and len({a['id'] for a in titles})==500
          assert sum(a['type']=='movie' for a in titles)==250
          assert sum(a['type']=='tv' for a in titles)==250
          assert sum(bool(a.get('summary')) for a in titles)==500
          assert all(a.get('summaryLanguage')=='fa' for a in titles if a.get('summary'))
          for a in titles:
              assert (Path('_site')/a['poster']).is_file(),a['id']
          assert len(list(Path('_site/backdrops').glob('*.jpg')))==6
          print('Verified 500 titles, 500 posters and 6 backdrops')
          PY
      - name: Verify local journal behavior
        working-directory: _site
        run: node --test ../tests/*.test.mjs
      - name: Verify catalogue refresh and fallback
        run: python3 -m unittest discover -s tests -p '*_test.py'
      - name: Refresh full IMDb charts and keep a valid fallback
        run: python3 scripts/refresh_catalogue.py
      - name: Validate the published payload with the browser validator
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import vm from 'node:vm';
          const context=vm.createContext({window:{}});
          vm.runInContext(await readFile('_site/live.js','utf8'),context);
          vm.runInContext(await readFile('_site/catalogue.js','utf8'),context);
          const feed=context.window.CinemaLive.validate(context.window.CINEMA_CATALOGUE);
          console.log('Validated published catalogue:',feed.titles.length,'active titles,',feed.archive.length,'archived; status:',feed.status);
          JS
      - name: Save the daily checkpoint and newly completed Persian metadata
        continue-on-error: true
        run: |
          if ! git diff --quiet -- data/catalogue-last-good.json data/persian-metadata-cache.json || ! git ls-files --error-unmatch data/catalogue-last-good.json data/persian-metadata-cache.json >/dev/null 2>&1; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/catalogue-last-good.json data/persian-metadata-cache.json
            git commit -m 'Save IMDb checkpoint and Persian metadata cache'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4

